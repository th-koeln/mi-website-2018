<figure class="{{ .class }}">
	{{ if .image }}
		{{ partial "atoms/mi-lqip/mi-lqip.html" (dict "image" .image "imgClass" .class "imgStyle" "width: 100%; height: auto;") }}
	{{ else if .imageSrc }}
		<img style="width: 100%; height: auto;" src='{{ .imageSrc | absURL }}' class="{{ .class }}" />
	{{ end }}
</figure>
